apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-theme-optavim
  namespace: auth
  labels:
    app: keycloak
    project: optavim
    theme: optavim
data:
  login.theme.properties: |
    ##############################################################################
    # OPTAVIM: Login theme (Keycloak 24.0.3 v2)
    # Inherits from the parent theme `keycloak.v2` (the modern one, since Keycloak 24).
    # Override: custom login.css + CSS logo + slogan.
    ##############################################################################

    parent=keycloak.v2
    import=common/keycloak

    # CSS override, loaded after the parent CSS (higher specificity)
    styles=css/login.css

    # Meta tags
    meta=viewport==width=device-width,initial-scale=1

    # Supported locales (i18n + messages_fr.properties for overrides)
    locales=fr

    # FR message bundle (override "Nom d'utilisateur ou courriel" to "Nom d'utilisateur")
    # File mounted at /opt/keycloak/themes/optavim/login/messages/messages_fr.properties
  login.login.css: |
    /* ============================================================================
     * OPTAVIM: Keycloak login theme
     * Conforms to the OPTAVIM Design System (dark signature, navy + blue + cyan)
     * Sources: Optavim Design System/tokens/{colors,typography,effects,spacing}.css
     *          Optavim Design System/ui_kits/keycloak_login/index.html (Aurora variant)
     * ========================================================================= */
    
    /* ===== Fonts (Google Fonts CDN) ===== */
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');
    
    /* ===== Design tokens, copied as is from Optavim DS ===== */
    :root {
      /* Raw colors: navy + Vision + Optimisation palette */
      --navy-950: #070B16;
      --navy-900: #0B1120;
      --navy-850: #0F1729;
      --navy-800: #131C32;
      --navy-700: #1E293B;
      --slate-400: #64748B;
      --slate-200: #CBD5E1;
      --slate-100: #E2E8F0;
      --white:     #FFFFFF;
    
      --blue-700: #1D4ED8;
      --blue-600: #2563EB;
      --blue-500: #3B82F6;
      --blue-400: #60A5FA;
      --cyan-500: #06B6D4;
      --cyan-400: #22D3EE;
      --iris-500: #6366F1;
      --green-400: #34D399;
      --red-400:   #F87171;
    
      /* Vision signature gradient */
      --grad-vision: linear-gradient(135deg, #3B82F6 0%, #22D3EE 100%);

      /* Aurora: brand signature background */
      --wp-aurora:
        radial-gradient(90% 80% at 18% 12%, #1D4ED8 0%, transparent 55%),
        radial-gradient(80% 70% at 88% 22%, #06B6D4 0%, transparent 50%),
        radial-gradient(70% 70% at 60% 100%, #312E81 0%, transparent 60%),
        linear-gradient(160deg, #0B1120, #070B16);
    
      /* Semantic aliases (dark mode, signature) */
      --brand:           var(--blue-500);
      --brand-strong:    var(--blue-600);
      --accent:          var(--cyan-400);
      --bg-base:         var(--navy-950);
      --bg-canvas:       var(--navy-900);
      --surface:         var(--navy-850);
      --surface-raised:  var(--navy-800);
      --surface-hover:   rgba(255, 255, 255, 0.04);
      --border:          rgba(148, 163, 184, 0.16);
      --border-strong:   rgba(148, 163, 184, 0.30);
      --text-strong:     var(--white);
      --text-body:       var(--slate-200);
      --text-muted:      var(--slate-400);
      --focus-ring:      rgba(59, 130, 246, 0.55);
    
      --shadow-lg:  0 18px 48px rgba(0, 0, 0, 0.55);
      --glow-brand: 0 0 0 1px rgba(59, 130, 246, 0.25), 0 8px 32px rgba(59, 130, 246, 0.28);
      --edge-light: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    
      --ease-out:    cubic-bezier(0.22, 1, 0.36, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --dur-base:    200ms;
    
      /* Spacing / radii */
      --r-sm: 6px;
      --r-md: 10px;
      --r-lg: 14px;

      /* Typography */
      --font-display: 'Space Grotesk', system-ui, sans-serif;
      --font-body:    'Manrope', system-ui, -apple-system, sans-serif;
      --font-mono:    'JetBrains Mono', 'SFMono-Regular', ui-monospace, monospace;
    }
    
    /* ===========================================================================
     * Layout: Aurora variant (split brand pane / form pane)
     * Left pane:  aurora background + logo + headline + slogan
     * Right pane: login card on navy-900 background
     * ========================================================================= */

    /* Base reset: no display:flex on body/html (it broke the PF v5 layout) */
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      height: 100% !important;
      min-height: 100vh !important;
      background: var(--bg-base) !important;
      color: var(--text-body) !important;
      font-family: var(--font-body) !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    body,
    .login-pf-page,
    .login-pf {
      background: var(--wp-aurora) !important;
      background-attachment: fixed !important;
      min-height: 100vh !important;
      display: block !important;
      width: 100% !important;
      max-width: none !important;
    }
    
    /* Hide hero pane v4 (does not exist in v5 but safety) */
    .pf-c-login__hero,
    .login-pf-page-hero {
      display: none !important;
    }
    
    /* ===== Brand pane (left), OPTAVIM marketing content =====
     * 3 pseudo-elements aligned on the same column, anchored at a fixed offset
     * from the TOP of the viewport (not vertically centered to avoid overlap):
     *   body::before          -> H2 (display, white, multi-line via \A)
     *   .login-pf-page::after -> descriptive paragraph (light gray)
     *   body::after           -> signature slogan footer bottom-left
     */
    
    /* Headline H2 */
    body::before {
      content: "Le conseil qui transforme\Ala vision en performance.";
      white-space: pre-line;
      position: fixed;
      top: 38vh;
      left: 56px;
      max-width: 520px;
      font-family: var(--font-display);
      font-size: clamp(2rem, 3.4vw, 2.6rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.04em;
      color: #ffffff;
      margin: 0;
      z-index: 1;
      pointer-events: none;
    }
    
    /* Descriptive paragraph under the H2, right below it (gap ~22px) */
    .login-pf-page::after,
    .login-pf::after {
      content: "Connectez-vous à votre espace de travail Optavim. Toutes vos missions, vos outils et vos ressources, en un seul accès sécurisé.";
      position: fixed;
      top: calc(38vh + 150px);
      left: 56px;
      max-width: 460px;
      font-family: var(--font-body);
      font-size: 16px;
      font-weight: 400;
      line-height: 1.6;
      color: rgba(226, 232, 240, 0.75);
      margin: 0;
      z-index: 1;
      pointer-events: none;
    }
    
    /* Badge "PORTAIL INTERNE SÉCURISÉ" removed (design decision 08/06) */
    .login-pf-page::before,
    .login-pf::before {
      display: none !important;
      content: none !important;
    }
    
    /* Slogan signature footer bottom-left */
    body::after {
      content: "OPTIMISATION  ·  VISION  ·  AMBITION";
      position: fixed;
      bottom: 32px;
      left: 56px;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.18em;
      color: rgba(226, 232, 240, 0.55);
      z-index: 1;
      pointer-events: none;
    }
    
    /* Responsive: hide the content pane on narrow screens */
    @media (max-width: 1100px) {
      body::before,
      body::after,
      .login-pf-page::before,
      .login-pf-page::after,
      .login-pf::before,
      .login-pf::after {
        display: none !important;
      }
    }
    
    /* ===== Header : logo + tagline ===== */
    #kc-header {
      position: fixed;
      top: 48px;
      left: 48px;
      z-index: 2;
    }
    
    #kc-header-wrapper {
      background-image: none !important;
      height: auto !important;
      padding: 0 !important;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0 !important; /* hide default text */
    }
    
    #kc-header-wrapper::before {
      content: "OPTAVIM";
      display: block;
      font-family: var(--font-display);
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      color: #ffffff;
      line-height: 1;
    }
    
    @media (max-width: 900px) {
      #kc-header { top: 24px; left: 24px; }
      #kc-header-wrapper::before { font-size: 1.3rem; }
    }
    
    /* ===== Layout PatternFly v5 (Keycloak 24+) ===== */
    /* The rendered DOM uses pf-v5-c-* classes (PatternFly v5).
     * Page wrapper:     .pf-v5-c-login + .pf-v5-c-login__container
     * "White" card:     .pf-v5-c-login__main  <- to transform into a dark surface
     * Header in card:   .pf-v5-c-login__main-header
     * Body in card:     .pf-v5-c-login__main-body
     * Footer:           .pf-v5-c-login__main-footer
     */
    
    .pf-v5-c-login {
      background: transparent !important;
      position: fixed !important;
      inset: 0 !important;
      display: flex !important;
      flex-direction: row !important;
      align-items: center !important;
      justify-content: flex-end !important;
      /* Increased padding-right to shift the card visually to the left.
       * Min cap 40px on small screens (< 1100px the marketing pane is hidden). */
      padding: 40px max(40px, 10vw) 40px 40px !important;
      box-sizing: border-box !important;
      width: 100vw !important;
      height: 100vh !important;
      max-width: none !important;
      overflow: auto;
    }
    
    .pf-v5-c-login__container {
      /* Identical fixed width on login / OTP / etc. No smaller min-width,
       * the card stays 460px regardless of the inner content length. */
      width: 460px !important;
      min-width: 460px !important;
      max-width: calc(100vw - 80px) !important;
      flex: 0 0 460px !important;
      margin: 0 !important;
      padding: 0 !important;
      display: flex !important;
      flex-direction: column !important;
      gap: 16px !important;
      grid-template-columns: none !important;
    }
    
    /* Also keep the "main" card at a fixed width (no shrink/expand based on
     * the content: the 6-digit OTP input must not shrink the card). */
    .pf-v5-c-login__main {
      width: 100% !important;
      min-width: 460px !important;
      box-sizing: border-box !important;
    }
    
    /* PF v5 header outside the card (above): we hide it, we have our
     * own top-left logo via #kc-header. */
    .pf-v5-c-login__header,
    .pf-v5-c-login__main-header-utilities {
      background: transparent !important;
    }
    
    /* The "main" card, white by default, that we transform */
    .pf-v5-c-login__main {
      background: var(--surface) !important;
      background-color: var(--surface) !important;
      border: 1px solid var(--border) !important;
      border-radius: var(--r-lg) !important;
      box-shadow: var(--shadow-lg), var(--edge-light) !important;
      color: var(--text-body) !important;
      position: relative;
      overflow: hidden;
      animation: ov-card-in 360ms var(--ease-out) both;
    }
    
    /* Glow halo around card on focus */
    .pf-v5-c-login__main::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: var(--r-lg);
      background: var(--grad-vision);
      opacity: 0;
      z-index: -1;
      filter: blur(20px);
      transition: opacity var(--dur-base) var(--ease-out);
      pointer-events: none;
    }
    
    .pf-v5-c-login__main:focus-within::before { opacity: 0.18; }
    
    /* Header inside card */
    .pf-v5-c-login__main-header,
    .pf-v5-c-login__main-header-utilities {
      background: transparent !important;
      border-bottom: none !important;
      padding: 36px 36px 0 !important;
      color: var(--text-strong) !important;
    }
    
    .pf-v5-c-login__main-header .pf-v5-c-title,
    .pf-v5-c-login__main-header h1,
    #kc-page-title {
      font-family: var(--font-display) !important;
      font-size: 1.75rem !important;
      font-weight: 700 !important;
      letter-spacing: -0.04em !important;
      line-height: 1.15 !important;
      color: var(--text-strong) !important;
      margin: 0 !important;
      padding: 0 !important;
      position: relative;
      word-break: normal !important;
      overflow-wrap: normal !important;
      white-space: normal !important;
      text-align: left !important;
      display: block !important;
      width: 100% !important;
    }
    
    /* Eyebrow "ACCÈS SÉCURISÉ" removed (design decision 08/06) */
    
    /* Sub-header / description */
    .pf-v5-c-login__main-header-desc {
      color: var(--text-muted) !important;
      font-size: 14px !important;
      margin-top: 8px !important;
    }
    
    /* Body inside card */
    .pf-v5-c-login__main-body {
      background: transparent !important;
      padding: 24px 36px 36px !important;
      color: var(--text-body) !important;
    }
    
    /* Footer inside card */
    .pf-v5-c-login__main-footer {
      background: transparent !important;
      border-top: 1px solid var(--border) !important;
      padding: 16px 36px !important;
    }
    
    .pf-v5-c-login__main-footer a {
      color: var(--brand) !important;
    }
    
    /* Footer band (links and registration) */
    .pf-v5-c-login__footer {
      background: transparent !important;
      color: var(--text-muted) !important;
      padding: 16px 0 !important;
      text-align: center;
    }
    
    /* ===== Eyebrow above title (spaced uppercase, mono) ===== */
    #kc-page-title {
      font-family: var(--font-display) !important;
      font-size: 2rem !important;
      font-weight: 700 !important;
      letter-spacing: -0.04em !important;
      line-height: 1.05 !important;
      color: var(--text-strong) !important;
      margin: 0 0 24px !important;
      text-align: left !important;
      position: relative;
    }
    
    #kc-page-title::before {
      content: "ACCÈS SÉCURISÉ";
      display: block;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      color: var(--accent);
      margin-bottom: 12px;
      line-height: 1;
    }
    
    /* ===== Form labels (PF v5) ===== */
    label,
    .pf-c-form__label,
    .pf-v5-c-form__label,
    .pf-v5-c-form__label-text,
    #kc-form-options label {
      color: var(--text-strong) !important;
      font-family: var(--font-body) !important;
      font-weight: 600 !important;
      font-size: 13px !important;
      margin-bottom: 6px !important;
      display: block !important;
    }
    
    .pf-v5-c-form__group {
      margin-bottom: 16px !important;
    }
    
    /* ===== Inputs (PF v5), uniform OTP-style pill =====
     * PF v5 wraps each input in <span class="pf-v5-c-form-control"> which carries
     * the visual (background + border + border-radius). The inner input is
     * "naked". We also override the PF pseudo-elements (::after that draws an
     * underline) and set PF's native CSS vars for a consistent focus state.
     */
    
    .pf-v5-c-form-control,
    .pf-c-form-control {
      --pf-v5-c-form-control--BorderRadius: 999px;
      --pf-v5-c-form-control--BorderColor: var(--border-strong);
      --pf-v5-c-form-control--BorderWidth: 1px;
      --pf-v5-c-form-control--BackgroundColor: var(--bg-canvas);
      --pf-v5-c-form-control--Color: var(--text-strong);
      --pf-v5-c-form-control--PaddingTop: 14px;
      --pf-v5-c-form-control--PaddingBottom: 14px;
      --pf-v5-c-form-control--PaddingLeft: 20px;
      --pf-v5-c-form-control--PaddingRight: 20px;
      --pf-v5-c-form-control--Height: 48px;
    
      background: var(--bg-canvas) !important;
      border: 1px solid var(--border-strong) !important;
      border-radius: 999px !important;
      color: var(--text-strong) !important;
      font-family: var(--font-body) !important;
      font-size: 14px !important;
      padding: 0 !important;
      height: 48px !important;
      width: 100% !important;
      box-sizing: border-box !important;
      box-shadow: none !important;
      display: flex !important;
      align-items: center !important;
      overflow: hidden !important;
      transition: border-color var(--dur-base) var(--ease-out),
                  box-shadow var(--dur-base) var(--ease-out) !important;
    }
    
    /* Kill PF v5 pseudo-element underline */
    .pf-v5-c-form-control::after,
    .pf-v5-c-form-control::before,
    .pf-c-form-control::after,
    .pf-c-form-control::before {
      display: none !important;
      content: none !important;
      border: none !important;
    }
    
    /* Inner native <input>: transparent, fills the wrapper */
    .pf-v5-c-form-control > input,
    .pf-v5-c-form-control input[type="text"],
    .pf-v5-c-form-control input[type="password"],
    .pf-v5-c-form-control input[type="email"],
    .pf-c-form-control > input,
    input.pf-v5-c-form-control,
    input.pf-c-form-control,
    input[type="text"],
    input[type="password"],
    input[type="email"] {
      background: transparent !important;
      background-color: transparent !important;
      border: none !important;
      border-radius: inherit !important;
      box-shadow: none !important;
      outline: none !important;
      color: var(--text-strong) !important;
      font-family: var(--font-body) !important;
      font-size: 14px !important;
      padding: 0 20px !important;
      height: 100% !important;
      width: 100% !important;
      flex: 1 1 auto !important;
      min-width: 0 !important;
    }
    
    /* If the input is itself the wrapper (no parent span) */
    input.pf-v5-c-form-control,
    input.pf-c-form-control,
    input[type="text"]:not(.pf-v5-c-form-control input):not(.pf-c-form-control input),
    input[type="password"]:not(.pf-v5-c-form-control input):not(.pf-c-form-control input),
    input[type="email"]:not(.pf-v5-c-form-control input):not(.pf-c-form-control input) {
      background: var(--bg-canvas) !important;
      border: 1px solid var(--border-strong) !important;
      border-radius: 999px !important;
      padding: 0 20px !important;
      height: 48px !important;
    }
    
    input::placeholder { color: var(--text-muted) !important; }
    
    /* Focus state: wrapper + naked input */
    .pf-v5-c-form-control:focus-within,
    .pf-c-form-control:focus-within,
    input.pf-v5-c-form-control:focus,
    input.pf-c-form-control:focus,
    input[type="text"]:focus,
    input[type="password"]:focus,
    input[type="email"]:focus {
      border-color: var(--brand) !important;
      box-shadow: 0 0 0 4px var(--focus-ring) !important;
      outline: none !important;
    }
    
    /* Invalid / error inputs */
    .pf-v5-c-form-control.pf-m-error,
    .pf-v5-c-form-control[aria-invalid="true"] {
      border-color: var(--danger, var(--red-400)) !important;
      box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.25) !important;
    }
    
    /* ===== Input group (password with eye toggle, PF v5) ===== */
    .pf-v5-c-input-group {
      background: var(--bg-canvas) !important;
      border: 1px solid var(--border-strong) !important;
      border-radius: 999px !important;
      height: 48px !important;
      padding: 0 6px 0 0 !important;
      overflow: hidden !important;
      display: flex !important;
      align-items: center !important;
      transition: border-color var(--dur-base) var(--ease-out),
                  box-shadow var(--dur-base) var(--ease-out) !important;
    }
    
    .pf-v5-c-input-group:focus-within {
      border-color: var(--brand) !important;
      box-shadow: 0 0 0 4px var(--focus-ring) !important;
    }
    
    /* The inner wrapper inside the input-group must not have its own border */
    .pf-v5-c-input-group .pf-v5-c-form-control {
      border: none !important;
      background: transparent !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      height: 100% !important;
      flex: 1 1 auto !important;
    }
    
    .pf-v5-c-input-group .pf-v5-c-form-control:focus-within {
      box-shadow: none !important;
    }
    
    .pf-v5-c-input-group .pf-v5-c-form-control > input,
    .pf-v5-c-input-group input {
      border: none !important;
      background: transparent !important;
      box-shadow: none !important;
      padding: 0 20px !important;
      height: 100% !important;
      border-radius: 0 !important;
    }
    
    /* ===== Eye button : full transparent, no visible box =====
     * Exact selector: <button class="pf-v5-c-button pf-m-control" data-password-toggle>
     * PF v5 .pf-m-control adds background:white + 4 borders via native CSS vars.
     * We override the vars + the direct properties + the pseudo-elements.
     */
    .pf-v5-c-input-group .pf-v5-c-button,
    .pf-v5-c-input-group .pf-v5-c-button.pf-m-control,
    .pf-v5-c-input-group .pf-v5-c-button.pf-m-plain,
    .pf-v5-c-input-group button[data-password-toggle],
    button[data-password-toggle].pf-v5-c-button {
      /* Override PF v5 native CSS vars (maximum priority over the DOM) */
      --pf-v5-c-button--BackgroundColor: transparent;
      --pf-v5-c-button--BorderColor: transparent;
      --pf-v5-c-button--BorderWidth: 0;
      --pf-v5-c-button--m-control--BackgroundColor: transparent;
      --pf-v5-c-button--m-control--Color: rgba(148, 163, 184, 0.55);
      --pf-v5-c-button--m-control--BorderColor: transparent;
      --pf-v5-c-button--m-control--BorderColor-base: transparent;
      --pf-v5-c-button--m-control--BorderColor-bottom: transparent;
      --pf-v5-c-button--m-control--BorderColor-top: transparent;
      --pf-v5-c-button--m-control--BorderColor-right: transparent;
      --pf-v5-c-button--m-control--BorderColor-left: transparent;
      --pf-v5-c-button--m-control--BorderRadius: 999px;
      --pf-v5-c-button--m-control--hover--BackgroundColor: transparent;
      --pf-v5-c-button--m-control--hover--BorderBottomColor: transparent;
      --pf-v5-c-button--m-control--focus--BackgroundColor: transparent;
      --pf-v5-c-button--m-control--focus--BorderBottomColor: transparent;
      --pf-v5-c-button--m-control--active--BackgroundColor: transparent;
    
      /* Hard override of the direct properties */
      background: transparent !important;
      background-color: transparent !important;
      background-image: none !important;
      border: 0 !important;
      border-width: 0 !important;
      border-style: none !important;
      border-color: transparent !important;
      outline: 0 !important;
      outline-color: transparent !important;
      box-shadow: none !important;
    
      color: rgba(148, 163, 184, 0.55) !important;
      height: 36px !important;
      width: 36px !important;
      min-width: 36px !important;
      margin-right: 8px !important;
      padding: 0 !important;
      border-radius: 999px !important;
      flex: 0 0 auto !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      transition: color var(--dur-base) var(--ease-out) !important;
    }
    
    /* Nuke any pseudo-elements (PF v5 sometimes draws the border via ::after) */
    .pf-v5-c-input-group .pf-v5-c-button::before,
    .pf-v5-c-input-group .pf-v5-c-button::after,
    .pf-v5-c-input-group .pf-v5-c-button.pf-m-control::before,
    .pf-v5-c-input-group .pf-v5-c-button.pf-m-control::after,
    button[data-password-toggle]::before,
    button[data-password-toggle]::after {
      display: none !important;
      content: none !important;
      background: transparent !important;
      border: 0 !important;
      box-shadow: none !important;
    }
    
    .pf-v5-c-input-group .pf-v5-c-button:hover,
    .pf-v5-c-input-group .pf-v5-c-button:focus,
    .pf-v5-c-input-group .pf-v5-c-button:active,
    button[data-password-toggle]:hover,
    button[data-password-toggle]:focus,
    button[data-password-toggle]:active {
      background: transparent !important;
      background-color: transparent !important;
      background-image: none !important;
      border: 0 !important;
      border-color: transparent !important;
      color: rgba(255, 255, 255, 0.95) !important;
      box-shadow: none !important;
      outline: 0 !important;
    }
    
    .pf-v5-c-input-group .pf-v5-c-button:focus-visible,
    button[data-password-toggle]:focus-visible {
      box-shadow: 0 0 0 2px var(--focus-ring) !important;
      border-radius: 999px !important;
    }
    
    /* Icon (i.fa or svg): currentColor + size */
    .pf-v5-c-input-group .pf-v5-c-button > i,
    .pf-v5-c-input-group .pf-v5-c-button > svg,
    button[data-password-toggle] > i,
    button[data-password-toggle] > svg {
      width: 18px !important;
      height: 18px !important;
      font-size: 16px !important;
      fill: currentColor !important;
      color: currentColor !important;
      line-height: 1 !important;
    }
    
    /* ===== Primary button (PF v5) ===== */
    input[type="submit"],
    .pf-c-button.pf-m-primary,
    .pf-v5-c-button.pf-m-primary,
    .pf-v5-c-button.pf-m-block,
    #kc-login,
    .btn-primary,
    .btn.btn-primary {
      background: var(--grad-vision) !important;
      background-color: var(--brand) !important;
      border: none !important;
      color: var(--white) !important;
      font-family: var(--font-body) !important;
      font-weight: 600 !important;
      font-size: 14px !important;
      letter-spacing: 0.01em !important;
      height: 44px !important;
      min-height: 44px !important;
      padding: 0 18px !important;
      border-radius: var(--r-md) !important;
      width: 100% !important;
      cursor: pointer !important;
      box-shadow: var(--glow-brand) !important;
      transition: transform var(--dur-base) var(--ease-spring),
                  filter var(--dur-base) var(--ease-out),
                  box-shadow var(--dur-base) var(--ease-out) !important;
      position: relative;
    }
    
    input[type="submit"]:hover,
    .pf-c-button.pf-m-primary:hover,
    .pf-v5-c-button.pf-m-primary:hover,
    #kc-login:hover {
      filter: brightness(1.08) !important;
      box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.35), 0 12px 40px rgba(59, 130, 246, 0.40) !important;
    }
    
    input[type="submit"]:active,
    .pf-c-button.pf-m-primary:active,
    .pf-v5-c-button.pf-m-primary:active,
    #kc-login:active {
      transform: scale(0.97) !important;
      filter: brightness(0.95) !important;
    }
    
    /* Secondary button: control */
    .pf-v5-c-button.pf-m-control {
      background: var(--surface-raised) !important;
      border: 1px solid var(--border-strong) !important;
      color: var(--text-body) !important;
      border-radius: var(--r-sm) !important;
    }
    
    .pf-v5-c-button.pf-m-control:hover {
      background: var(--surface-hover) !important;
      color: var(--text-strong) !important;
    }
    
    /* Select dropdown (locale switcher in card) */
    select,
    .pf-v5-c-form-control select {
      background: var(--bg-canvas) !important;
      border: 1px solid var(--border-strong) !important;
      border-radius: var(--r-md) !important;
      color: var(--text-strong) !important;
      font-family: var(--font-body) !important;
      height: 44px !important;
      padding: 0 12px !important;
    }
    
    /* ===== Links ===== */
    a,
    .login-pf-page a,
    #kc-form-options a {
      color: var(--brand) !important;
      font-weight: 600 !important;
      font-size: 13px !important;
      text-decoration: none !important;
      transition: color var(--dur-base) var(--ease-out) !important;
    }
    
    a:hover {
      color: var(--accent) !important;
      text-decoration: none !important;
    }
    
    /* ===== "Remember me" + "Forgot password" row ===== */
    #kc-form-options {
      display: flex !important;
      justify-content: space-between !important;
      align-items: center !important;
      margin: 8px 0 18px !important;
      font-size: 13px !important;
    }
    
    #kc-form-options input[type="checkbox"] {
      width: 16px !important;
      height: 16px !important;
      accent-color: var(--brand) !important;
      margin-right: 8px !important;
      vertical-align: middle !important;
    }
    
    /* ===== Messages : alerts ===== */
    .alert,
    .pf-c-alert,
    .kc-feedback-text {
      border-radius: var(--r-md) !important;
      padding: 12px 14px !important;
      font-size: 13px !important;
      font-weight: 500 !important;
      margin-bottom: 18px !important;
      border-left: 3px solid;
      background: var(--surface-raised) !important;
    }
    
    .alert-error, .pf-c-alert.pf-m-danger, .kc-feedback-error {
      border-left-color: var(--red-400) !important;
      color: #fecaca !important;
      background: rgba(239, 68, 68, 0.10) !important;
    }
    
    .alert-success, .pf-c-alert.pf-m-success {
      border-left-color: var(--green-400) !important;
      color: #bbf7d0 !important;
      background: rgba(16, 185, 129, 0.10) !important;
    }
    
    .alert-warning, .pf-c-alert.pf-m-warning {
      border-left-color: var(--accent) !important;
      color: #fde68a !important;
      background: rgba(245, 158, 11, 0.10) !important;
    }
    
    /* ===== Hidden locale selector (French only supported language) =====
     * Belt-and-suspenders: realm `supportedLocales=["fr"]` on the Keycloak side
     * normally no longer renders the dropdown, but we also hide all known classes
     * in CSS (PF v5 uses `.pf-v5-c-select` for this component).
     */
    #kc-locale,
    #kc-locale-dropdown,
    #kc-locale-wrapper,
    .pf-v5-c-form__group.login-pf-settings,
    .kc-dropdown,
    .pf-v5-c-select,
    .login-pf-settings,
    [id*="locale"] {
      display: none !important;
    }
    
    /* If the dropdown is nested in a form group, hide the whole group */
    .pf-v5-c-form__group:has(.pf-v5-c-select),
    .pf-v5-c-form__group:has(#kc-locale-dropdown) {
      display: none !important;
    }
    
    /* ===== Footer / info messages below form ===== */
    #kc-info,
    #kc-registration,
    .login-pf-page-footer {
      margin-top: 20px !important;
      text-align: center !important;
      font-size: 13px !important;
      color: var(--text-muted) !important;
      background: transparent !important;
    }
    
    #kc-info a, #kc-registration a {
      color: var(--brand) !important;
    }
    
    /* ===== Social providers (if enabled) ===== */
    .kc-social-providers,
    #kc-social-providers {
      margin-top: 16px !important;
      display: flex !important;
      flex-direction: column !important;
      gap: 10px !important;
    }
    
    #kc-social-providers a {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 10px !important;
      height: 44px !important;
      border-radius: var(--r-md) !important;
      border: 1px solid var(--border-strong) !important;
      background: var(--surface-raised) !important;
      color: var(--text-strong) !important;
      font-family: var(--font-body) !important;
      font-size: 14px !important;
      font-weight: 600 !important;
      text-decoration: none !important;
      transition: background var(--dur-base) var(--ease-out) !important;
    }
    
    #kc-social-providers a:hover {
      background: var(--surface-hover) !important;
      color: var(--text-strong) !important;
    }
    
    /* ===== Form group spacing ===== */
    .form-group,
    .pf-c-form__group {
      margin-bottom: 16px !important;
    }
    
    /* ===== Scrollbar (subtle dark mode) ===== */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-base); }
    ::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--slate-400); }
    
    /* ===== Card entry animation ===== */
    .card-pf {
      animation: ov-card-in 360ms var(--ease-out) both;
    }
    
    @keyframes ov-card-in {
      from { opacity: 0; transform: translateY(8px) scale(0.99); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    
    /* ===== Selection text ===== */
    ::selection {
      background: rgba(59, 130, 246, 0.35);
      color: var(--white);
    }
  login.messages_fr.properties: |
    # OPTAVIM: FR i18n overrides for the Keycloak login theme
    # Format: key=value (.properties, doubled backslash for accents)
    #
    # Key reference: keycloak/themes/base/login/messages/messages_fr.properties

    # "Nom d'utilisateur ou courriel" simplified to "Nom d'utilisateur"
    usernameOrEmail=Nom d''utilisateur
    username=Nom d''utilisateur

    # TOTP page: clarify that the user must enter the 2-factor code
    loginOtpOneTime=Code à 6 chiffres (authentification 2 facteurs)
    otpFormTitle=Authentification à deux facteurs
    loginTotpHeader=Authentification à deux facteurs
    loginOtpHeader=Authentification à deux facteurs
    
    # Description below the input (shown as label-description via Keycloak)
    loginOtpDescription=Saisissez le code à 6 chiffres affiché par votre application d''authentification mobile.
  account.theme.properties: |
    ##############################################################################
    # OPTAVIM: Account theme (Keycloak user page)
    # Inherits from the v3 account theme (modern, since Keycloak 24)
    ##############################################################################
    
    parent=keycloak.v3
    
    styles=css/account.css
    
    meta=viewport==width=device-width,initial-scale=1
  account.account.css: |
    /* ============================================================================
     * OPTAVIM: Account console theme
     * Light override on the account console v3 (React app by Keycloak)
     * ========================================================================= */
    
    :root {
      --optavim-blue-deep:   #0b3954;
      --optavim-blue-bright: #2563eb;
      --optavim-blue-tint:   #e0eaf5;
      --optavim-text:        #1f2937;
    }
    
    /* Nav top bar: primary color */
    header.pf-c-page__header,
    .pf-c-page__header {
      background: linear-gradient(90deg, var(--optavim-blue-deep), var(--optavim-blue-bright)) !important;
      color: #ffffff !important;
    }
    
    .pf-c-page__header-brand-link,
    .pf-c-page__header-brand-link::before {
      color: #ffffff !important;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    
    /* Primary buttons */
    .pf-c-button.pf-m-primary {
      background: var(--optavim-blue-bright) !important;
      border-color: var(--optavim-blue-bright) !important;
    }
    
    .pf-c-button.pf-m-primary:hover {
      background: var(--optavim-blue-deep) !important;
      border-color: var(--optavim-blue-deep) !important;
    }
    
    /* Links */
    a {
      color: var(--optavim-blue-bright) !important;
    }

    a:hover {
      color: var(--optavim-blue-deep) !important;
    }

    /* Footer slogan (optional) */
    body::after {
      content: "OPTAVIM — Optimisation · Vision · Ambition";
      display: block;
      text-align: center;
      color: rgba(11, 57, 84, 0.5);
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      padding: 1.5rem 0;
      font-weight: 500;
    }
