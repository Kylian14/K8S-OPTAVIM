apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 00-namespace-secret.yaml
  - 01-statefulset.yaml
  - 02-ingressroute.yaml
  - 04-resourcequota.yaml
  - ./themes

# themes/02-statefulset-patch.yaml starts straight at `spec:` with no
# apiVersion/kind/metadata, so kustomize v5 can't load it via `patches: { path }`.
# We keep that file as is and write the same merge inline below, with the
# header and target kustomize needs.
patches:
  - target:
      kind: StatefulSet
      name: keycloak
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: keycloak
        namespace: auth
      spec:
        template:
          spec:
            volumes:
              - name: theme-optavim
                configMap:
                  name: keycloak-theme-optavim
                  defaultMode: 0644
            containers:
              - name: keycloak
                volumeMounts:
                  - name: theme-optavim
                    mountPath: /opt/keycloak/themes/optavim/login/theme.properties
                    subPath: login.theme.properties
                    readOnly: true
                  - name: theme-optavim
                    mountPath: /opt/keycloak/themes/optavim/login/resources/css/login.css
                    subPath: login.login.css
                    readOnly: true
                  - name: theme-optavim
                    mountPath: /opt/keycloak/themes/optavim/login/messages/messages_fr.properties
                    subPath: login.messages_fr.properties
                    readOnly: true
                  - name: theme-optavim
                    mountPath: /opt/keycloak/themes/optavim/account/theme.properties
                    subPath: account.theme.properties
                    readOnly: true
                  - name: theme-optavim
                    mountPath: /opt/keycloak/themes/optavim/account/resources/css/account.css
                    subPath: account.account.css
                    readOnly: true
