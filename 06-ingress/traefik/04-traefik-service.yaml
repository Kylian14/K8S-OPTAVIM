# ==============================================================================
# Traefik Service NodePort (namespace: ingress)
# HAProxy in front routes:
#   - 80  -> NodePort 30080 (HTTP)
#   - 443 -> NodePort 30443 (HTTPS)
# on workers 10.1.40.4, 10.1.40.5, 10.1.40.6
#
# Separate dashboard Service (ClusterIP, internal only)
# ==============================================================================

---
# Main service: inbound HTTP/HTTPS traffic from HAProxy
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: ingress
  labels:
    app: traefik
    phase: "5"
    project: optavim
spec:
  type: NodePort
  selector:
    app: traefik
  ports:
    - name: web
      port: 80
      targetPort: web
      nodePort: 30080
      protocol: TCP
    - name: websecure
      port: 443
      targetPort: websecure
      nodePort: 30443
      protocol: TCP

---
# Dashboard service: internal access only (kubectl port-forward or dedicated IngressRoute)
apiVersion: v1
kind: Service
metadata:
  name: traefik-dashboard
  namespace: ingress
  labels:
    app: traefik
    phase: "5"
    project: optavim
spec:
  type: ClusterIP
  selector:
    app: traefik
  ports:
    - name: dashboard
      port: 8080
      targetPort: dashboard
      protocol: TCP

---
# Metrics service: dedicated Prometheus scrape endpoint.
# Exposed as ClusterIP only (never via public Ingress).
apiVersion: v1
kind: Service
metadata:
  name: traefik-metrics
  namespace: ingress
  labels:
    app: traefik
    project: optavim
    component: metrics
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8082"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: traefik
  ports:
    - name: metrics
      port: 8082
      targetPort: metrics
      protocol: TCP
