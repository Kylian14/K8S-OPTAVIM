# ClusterAdcsIssuer: the whole cluster can request certificates
# via cert-manager (Certificate) -> adcs-issuer -> AD CS DC-01.
#
# The caBundle holds the AD CS root certificate.
# To regenerate it:
#   openssl s_client -showcerts -connect 10.1.20.1:636 </dev/null \
#     | openssl x509 | base64 -w0
apiVersion: adcs.certmanager.csf.nokia.com/v1
kind: ClusterAdcsIssuer
metadata:
  name: adcs-optavim
spec:
  url: http://10.1.20.1/certsrv
  templateName: WebServer
  retryInterval: 1h
  statusCheckInterval: 6h
  credentialsRef:
    name: adcs-issuer-credentials
  # Root certificate `optavim-DC-AD-DC-01-CA` (valid until 2031-03-21)
  caBundle: 
