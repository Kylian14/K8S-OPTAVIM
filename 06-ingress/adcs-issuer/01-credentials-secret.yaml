# AD credentials used by adcs-issuer to connect to AD CS.
# The account must have "Enroll" rights on the certificate template (WebServer).
apiVersion: v1
kind: Secret
metadata:
  name: adcs-issuer-credentials
  namespace: adcs-issuer
type: Opaque
stringData:
  username: "CHANGE_ME_OPTAVIM\\svc_adcs"   # Domain\\User (e.g. OPTAVIM\\svc_adcs)
  password: "CHANGE_ME_password"
