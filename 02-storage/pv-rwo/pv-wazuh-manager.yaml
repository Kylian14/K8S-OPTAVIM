apiVersion: v1
kind: PersistentVolume
metadata:
  name: pvc-wazuh-manager
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-client
  nfs:
    server: 10.1.30.100
    path: /data/exports/wazuh-mgr
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-wazuh-manager
  namespace: security
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-client
  resources:
    requests:
      storage: 5Gi
