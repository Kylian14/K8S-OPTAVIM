apiVersion: v1
kind: PersistentVolume
metadata:
  name: galera-data-galera-0
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-client
  claimRef:
    namespace: databases
    name: galera-data-galera-0
  nfs:
    server: 10.1.30.100
    path: /data/exports/galera-0
