# Wazuh secrets: admin passwords + Keycloak OIDC client (filled by the
# 07-keycloak/03-post-deploy-realm.sh script).
apiVersion: v1
kind: Secret
metadata:
  name: wazuh-secret
  namespace: security
  labels:
    app: wazuh
    project: optavim
type: Opaque
stringData:
  # OpenSearch indexer: admin user.
  # The image ships with admin:admin and the "reserved" flag in internal_users.yml,
  # so it cannot be changed via the API. For real prod, edit
  # internal_users.yml (ConfigMap + mount) and re-run securityadmin.sh.
  INDEXER_PASSWORD: "admin"
  # Wazuh Manager API password (used by the Dashboard)
  # Wazuh requires: 8+ chars, upper + lower + digit + special character
  API_PASSWORD: "CHANGE_ME_wazuh_api_password"
  # Keycloak OIDC client (auto-filled by 03-post-deploy-realm.sh)
  OIDC_CLIENT_SECRET: "CHANGE_ME_after_keycloak_client_creation"
