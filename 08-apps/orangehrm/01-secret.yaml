apiVersion: v1
kind: Secret
metadata:
  name: orangehrm-secret
  namespace: apps
  labels:
    app: orangehrm
    project: optavim
type: Opaque
stringData:
  DATABASE_PASSWORD: "CHANGE_ME_password"
  ORANGEHRM_ADMIN_PASSWORD: "CHANGE_ME_password"
  # SAML IdP certificate (PEM format without the markers), copied from Keycloak
  # Realm Settings → Keys → RS256 → Certificate
  SAML_IDP_CERT: "CHANGE_ME_after_keycloak_client_creation"
