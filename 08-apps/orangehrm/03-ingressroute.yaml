---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: orangehrm-https
  namespace: apps
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`rh.optavim.corp`)
      kind: Rule
      services:
        - name: orangehrm
          namespace: apps
          port: 80
          # Sticky sessions: same reason as Dolibarr (local PHP sessions).
          sticky:
            cookie:
              name: OHRM_STICKY
              secure: true
              httpOnly: true
              sameSite: lax
  tls:
    secretName: optavim-wildcard-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: orangehrm-http
  namespace: apps
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`rh.optavim.corp`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: ingress
      services:
        - name: orangehrm
          namespace: apps
          port: 80
