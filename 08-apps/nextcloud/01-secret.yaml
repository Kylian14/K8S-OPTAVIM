# Nextcloud secrets, to fill in BEFORE the kubectl apply.
# Generate the passwords: openssl rand -base64 24
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-secret
  namespace: apps
  labels:
    app: nextcloud
    project: optavim
type: Opaque
stringData:
  MYSQL_PASSWORD: "CHANGE_ME_password"
  NEXTCLOUD_ADMIN_PASSWORD: "CHANGE_ME_password"
  # OIDC client secret (generated by Keycloak after creating the client in the OPTAVIM realm)
  OIDC_CLIENT_SECRET: "CHANGE_ME_after_keycloak_client_creation"
