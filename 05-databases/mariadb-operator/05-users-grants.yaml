###############################################################################
# 4. ORANGEHRM
# Warning, runtime DISCOVERY MO-5 (2026-06-07):
#    OrangeHRM's Conf.php (/var/www/html/lib/confs/Conf.php) hardcodes the
#    `orangehrm_admin` user (NOT `orangehrm` as the DATABASE_USER env
#    suggested). We create TWO users on the DB side:
#    - `orangehrm` (main User CRD, keeps a consistent logical name)
#    - `orangehrm_admin` (compat with the orangehrm:5.7 container Conf.php)
###############################################################################
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: orangehrm
  namespace: databases
  labels:
    project: optavim
spec:
  mariaDbRef:
    name: mariadb-galera
  passwordSecretKeyRef:
    name: mariadb-app-passwords
    key: orangehrm
  host: "%"
  maxUserConnections: 100

---
apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: orangehrm-admin
  namespace: databases
  labels:
    project: optavim
spec:
  mariaDbRef:
    name: mariadb-galera
  # mariadb-operator derives the SQL name from metadata.name if not overridden
  # We explicitly force name=orangehrm_admin (otherwise translated to orangehrm-admin)
  name: orangehrm_admin
  passwordSecretKeyRef:
    name: mariadb-app-passwords
    key: orangehrm
  host: "%"
  maxUserConnections: 100

---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: orangehrm-all-privileges
  namespace: databases
  labels:
    project: optavim
spec:
  mariaDbRef:
    name: mariadb-galera
  privileges: ["ALL PRIVILEGES"]
  database: "orangehrm_db"
  table: "*"
  username: orangehrm
  host: "%"

---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: orangehrm-admin-all-privileges
  namespace: databases
  labels:
    project: optavim
spec:
  mariaDbRef:
    name: mariadb-galera
  privileges: ["ALL PRIVILEGES"]
  database: "orangehrm_db"
  table: "*"
  username: orangehrm_admin
  host: "%"

