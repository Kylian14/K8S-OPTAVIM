##############################################################################
# OPTAVIM: User + Grant CRDs (5 application accounts)
# Namespace: databases
#
# Declarative management of the mariadb accounts. Each User has its password
# referenced from the mariadb-app-passwords Secret. Each Grant gives ALL PRIVILEGES
# on the matching schema.
#
# Note: the User CRD runs CREATE OR REPLACE USER on reconcile. If the account
# already exists (after bootstrap), the password is reset from the Secret.
##############################################################################

###############################################################################
# 1. KEYCLOAK
###############################################################################
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: keycloak
  namespace: databases
  labels:
    project: optavim
spec:
  mariaDbRef:
    name: mariadb-galera
  passwordSecretKeyRef:
    name: mariadb-app-passwords
    key: keycloak
  host: "%"
  maxUserConnections: 100

---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: keycloak-all-privileges
  namespace: databases
  labels:
    project: optavim
spec:
  mariaDbRef:
    name: mariadb-galera
  privileges: ["ALL PRIVILEGES"]
  database: "keycloak_db"
  table: "*"
  username: keycloak
  host: "%"
  grantOption: false

