##############################################################################
# OPTAVIM: Secrets for mariadb-operator (root + 5 app passwords)
# Namespace: databases
#
# We reuse the passwords already used by the apps so the cutover is
# transparent: no need to redeploy the apps with a new password.
#
# Placeholders to fill in before apply. In prod: sealed-secrets or Vault.
##############################################################################

---
# Root password of the MariaDB cluster (used by the operator and the audit scripts)
apiVersion: v1
kind: Secret
metadata:
  name: mariadb-root-password
  namespace: databases
  labels:
    project: optavim
type: Opaque
stringData:
  password: "CHANGE_ME_password"

---
# Application passwords, referenced by the User CRDs (User.spec.passwordSecretKeyRef)
# Each key matches a mariadb account created by the User CRD.
apiVersion: v1
kind: Secret
metadata:
  name: mariadb-app-passwords
  namespace: databases
  labels:
    project: optavim
type: Opaque
stringData:
  keycloak: "CHANGE_ME_password"
  nextcloud: "CHANGE_ME_password"
  dolibarr: "CHANGE_ME_password"
  orangehrm: "CHANGE_ME_password"
  privacyidea: "CHANGE_ME_password"

---
# Copy of minio-creds in the databases ns: the MariaDB CR lives here and references
# its local Secrets. The source Secret is in the mariadb-backup ns (01-minio.yaml).
# Keep both in sync; for V2, see external-secrets-operator.
apiVersion: v1
kind: Secret
metadata:
  name: minio-creds
  namespace: databases
  labels:
    project: optavim
    sync-from: mariadb-backup/minio-creds
type: Opaque
stringData:
  accessKey: "CHANGE_ME_minio_access_key"
  secretKey: "CHANGE_ME_minio_secret_key"
