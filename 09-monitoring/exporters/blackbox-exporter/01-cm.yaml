##############################################################################
# OPTAVIM Blackbox exporter modules config
# Defined modules:
#   - http_2xx        : GET returning 2xx (TLS skip verify for internal endpoints)
#   - http_external   : GET with cert validation (internet-facing)
#   - tcp_connect     : simple TCP connect
#   - icmp            : ping
#   - dns             : query A record against a resolver
##############################################################################
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-exporter
  namespace: monitoring
  labels:
    app: blackbox-exporter
    project: optavim
    component: metrics
data:
  blackbox.yml: |
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http:
          valid_http_versions: [HTTP/1.1, HTTP/2.0]
          valid_status_codes: [200, 301, 302, 303]
          method: GET
          follow_redirects: false
          fail_if_ssl: false
          fail_if_not_ssl: false
          tls_config:
            # internal AD CA not publicly trusted, skip
            insecure_skip_verify: true
          preferred_ip_protocol: ip4

      http_external:
        prober: http
        timeout: 10s
        http:
          valid_http_versions: [HTTP/1.1, HTTP/2.0]
          valid_status_codes: [200, 301, 302, 303]
          method: GET
          tls_config:
            insecure_skip_verify: false   # strict validation for internet
          preferred_ip_protocol: ip4

      tcp_connect:
        prober: tcp
        timeout: 5s
        tcp:
          preferred_ip_protocol: ip4

      icmp:
        prober: icmp
        timeout: 5s
        icmp:
          preferred_ip_protocol: ip4
          source_ip_address: "0.0.0.0"

      dns:
        prober: dns
        timeout: 5s
        dns:
          query_name: "auth.optavim.corp"
          query_type: "A"
          preferred_ip_protocol: ip4
