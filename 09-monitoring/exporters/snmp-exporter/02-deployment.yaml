##############################################################################
# OPTAVIM SNMP exporter Deployment
# Prometheus scrape: snmp_exporter:9116/snmp?target=X&module=Y
##############################################################################
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snmp-exporter
  namespace: monitoring
  labels:
    app: snmp-exporter
    project: optavim
    component: metrics
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: snmp-exporter
  template:
    metadata:
      labels:
        app: snmp-exporter
        project: optavim
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: snmp-exporter
          image: prom/snmp-exporter:v0.26.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # Uses the image built-in snmp.yml (covers IF-MIB, UCD-SNMP-MIB
          # generated by snmp_generator from the standard MIBs). The custom
          # OPTAVIM ConfigMap (01-cm.yaml) stays in place for reference: its
          # format needs migrating to the new auth-split schema (see snmp_exporter docs).
          args:
            - --web.listen-address=:9116
          ports:
            - name: snmp
              containerPort: 9116
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # volumeMounts temporarily disabled, built-in snmp.yml used
          # - name: config
          #   mountPath: /etc/snmp_exporter
          #   readOnly: true
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: snmp
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /-/healthy
              port: snmp
            initialDelaySeconds: 5
            periodSeconds: 10
      # volumes disabled (see note above)
      # volumes:
      #   - name: config
      #     configMap:
      #       name: snmp-exporter
---
apiVersion: v1
kind: Service
metadata:
  name: snmp-exporter
  namespace: monitoring
  labels:
    app: snmp-exporter
    project: optavim
    component: metrics
spec:
  type: ClusterIP
  selector:
    app: snmp-exporter
  ports:
    - name: snmp
      port: 9116
      targetPort: snmp
      protocol: TCP
