---
##############################################################################
# OPTAVIM Grafana dashboards ConfigMap (auto-generated by dashboards/sync.sh)
# Do not edit by hand: edit dashboards/*.json then re-run sync.sh
##############################################################################
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-optavim
  namespace: monitoring
  labels:
    app: grafana
    project: optavim
    component: dashboards
data:
  01-executive.json: |
    {
      "uid": "opta-exec",
      "title": "OPTAVIM — Synthèse",
      "tags": ["optavim", "exec"],
      "timezone": "browser",
      "refresh": "30s",
      "time": {"from": "now-24h", "to": "now"},
      "schemaVersion": 39,
      "version": 1,
      "editable": false,
      "graphTooltip": 1,
      "links": [
        {"title": "K8s Cluster", "type": "dashboards", "tags": ["optavim", "k8s"], "asDropdown": false, "includeVars": true, "keepTime": true},
        {"title": "Identity (Keycloak)", "url": "/d/opta-id", "type": "link", "icon": "external link"},
        {"title": "MariaDB", "url": "/d/opta-db-galera", "type": "link", "icon": "external link"},
        {"title": "Ingress", "url": "/d/opta-ingress", "type": "link", "icon": "external link"}
      ],
      "templating": {"list": [
        {"name": "datasource", "type": "datasource", "query": "prometheus", "current": {"text": "Prometheus", "value": "Prometheus"}, "hide": 0}
      ]},
      "panels": [
        {
          "id": 1, "type": "row", "title": "Vue d'ensemble", "gridPos": {"h": 1, "w": 24, "x": 0, "y": 0}, "collapsed": false
        },
        {
          "id": 2, "type": "stat", "title": "Services en ligne",
          "gridPos": {"h": 5, "w": 4, "x": 0, "y": 1},
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "targets": [{"expr": "count(up == 1)", "refId": "A", "instant": true}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"color": {"mode": "fixed", "fixedColor": "#22D3EE"}, "unit": "short"}}
        },
        {
          "id": 3, "type": "stat", "title": "Services en panne",
          "gridPos": {"h": 5, "w": 4, "x": 4, "y": 1},
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "targets": [{"expr": "count(up == 0)", "refId": "A", "instant": true}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "#22D3EE", "value": null}, {"color": "#F59E0B", "value": 1}, {"color": "#EF4444", "value": 3}]}, "unit": "short"}}
        },
        {
          "id": 4, "type": "stat", "title": "Membres de la base",
          "gridPos": {"h": 5, "w": 4, "x": 8, "y": 1},
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "targets": [{"expr": "mysql_global_status_wsrep_cluster_size", "refId": "A", "instant": true}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "#EF4444", "value": null}, {"color": "#F59E0B", "value": 2}, {"color": "#22D3EE", "value": 3}]}, "unit": "short"}}
        },
        {
          "id": 5, "type": "stat", "title": "Applications actives",
          "gridPos": {"h": 5, "w": 4, "x": 12, "y": 1},
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "targets": [{"expr": "sum(kube_pod_status_phase{phase=\"Running\"})", "refId": "A", "instant": true}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"color": {"mode": "fixed", "fixedColor": "#3B82F6"}, "unit": "short"}}
        },
        {
          "id": 6, "type": "stat", "title": "Serveurs prêts",
          "gridPos": {"h": 5, "w": 4, "x": 16, "y": 1},
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "targets": [{"expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})", "refId": "A", "instant": true}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "#EF4444", "value": null}, {"color": "#F59E0B", "value": 4}, {"color": "#22D3EE", "value": 6}]}, "unit": "short"}}
        },
        {
          "id": 7, "type": "stat", "title": "Disponibilité",
          "gridPos": {"h": 5, "w": 4, "x": 20, "y": 1},
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "targets": [{"expr": "time() - max(kube_node_created)", "refId": "A", "instant": true}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "value"},
          "fieldConfig": {"defaults": {"color": {"mode": "fixed", "fixedColor": "#6366F1"}, "unit": "s"}}
        },
        {
          "id": 10, "type": "row", "title": "Disponibilité des sites", "gridPos": {"h": 1, "w": 24, "x": 0, "y": 6}, "collapsed": false
        },
        {
          "id": 11, "type": "stat", "title": "Sites en ligne",
          "gridPos": {"h": 6, "w": 12, "x": 0, "y": 7},
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "targets": [{"expr": "probe_success{job=\"blackbox-http\"}", "refId": "A", "legendFormat": "{{instance}}", "instant": false}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "orientation": "auto"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "#EF4444", "value": null}, {"color": "#22D3EE", "value": 1}]}, "mappings": [{"options": {"0": {"text": "DOWN", "color": "red"}, "1": {"text": "UP", "color": "green"}}, "type": "value"}], "unit": "short"}}
        },
        {
          "id": 12, "type": "timeseries", "title": "Latence sites (p95)",
          "gridPos": {"h": 6, "w": 12, "x": 12, "y": 7},
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "targets": [{"expr": "probe_duration_seconds{job=\"blackbox-http\"}", "refId": "A", "legendFormat": "{{instance}}"}],
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "unit": "s"}}
        },
        {
          "id": 20, "type": "row", "title": "Ressources", "gridPos": {"h": 1, "w": 24, "x": 0, "y": 13}, "collapsed": false
        },
        {
          "id": 21, "type": "timeseries", "title": "CPU par serveur",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 14},
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "targets": [{"expr": "100 * (1 - avg by(instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])))", "refId": "A", "legendFormat": "{{instance}}"}],
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "unit": "percent", "min": 0, "max": 100}}
        },
        {
          "id": 22, "type": "timeseries", "title": "Mémoire par serveur",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 14},
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "targets": [{"expr": "100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)", "refId": "A", "legendFormat": "{{instance}}"}],
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "unit": "percent", "min": 0, "max": 100}}
        }
      ]
    }
  02-k8s-cluster.json: |
    {
      "uid": "opta-k8s-cluster",
      "title": "OPTAVIM — Cluster Kubernetes",
      "tags": ["optavim", "k8s"],
      "timezone": "browser",
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "schemaVersion": 39,
      "version": 1,
      "editable": false,
      "templating": {"list": [
        {"name": "datasource", "type": "datasource", "query": "prometheus", "current": {"text": "Prometheus", "value": "Prometheus"}, "hide": 0}
      ]},
      "links": [
        {"title": "Executive", "url": "/d/opta-exec", "type": "link", "icon": "external link"},
        {"title": "K8s Workloads", "url": "/d/opta-k8s-wl", "type": "link", "icon": "external link"}
      ],
      "panels": [
        {"id": 1, "type": "row", "title": "Serveurs", "gridPos": {"h": 1, "w": 24, "x": 0, "y": 0}},
        {
          "id": 2, "type": "table", "title": "État des serveurs",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 1},
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "targets": [{"expr": "kube_node_status_condition{condition=\"Ready\"}", "refId": "A", "format": "table", "instant": true}],
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}}}
        },
        {
          "id": 3, "type": "timeseries", "title": "Applications par espace",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 1},
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "targets": [{"expr": "sum by (namespace) (kube_pod_status_phase{phase=\"Running\"})", "refId": "A", "legendFormat": "{{namespace}}"}],
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "unit": "short"}}
        },
        {"id": 10, "type": "row", "title": "Ressources", "gridPos": {"h": 1, "w": 24, "x": 0, "y": 9}},
        {
          "id": 11, "type": "timeseries", "title": "CPU par serveur",
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 10},
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "targets": [{"expr": "100 * (1 - avg by(instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])))", "refId": "A", "legendFormat": "{{instance}}"}],
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "unit": "percent", "min": 0, "max": 100}}
        },
        {
          "id": 12, "type": "timeseries", "title": "Mémoire par serveur",
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 10},
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "targets": [{"expr": "100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)", "refId": "A", "legendFormat": "{{instance}}"}],
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "unit": "percent", "min": 0, "max": 100}}
        },
        {
          "id": 13, "type": "timeseries", "title": "Espace disque",
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 10},
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "targets": [{"expr": "100 * (1 - node_filesystem_avail_bytes{fstype!~\"tmpfs|overlay\"} / node_filesystem_size_bytes{fstype!~\"tmpfs|overlay\"})", "refId": "A", "legendFormat": "{{instance}} {{mountpoint}}"}],
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "unit": "percent", "min": 0, "max": 100}}
        },
        {"id": 20, "type": "row", "title": "Redémarrages", "gridPos": {"h": 1, "w": 24, "x": 0, "y": 18}},
        {
          "id": 21, "type": "timeseries", "title": "Redémarrages (5 min)",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 19},
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "targets": [{"expr": "sum by (namespace, pod) (kube_pod_container_status_restarts_total)", "refId": "A", "legendFormat": "{{namespace}}/{{pod}}"}],
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "unit": "short"}}
        }
      ]
    }
  03-k8s-workloads.json: |
    {
      "uid": "opta-k8s-wl",
      "title": "OPTAVIM — Applications détaillées",
      "tags": ["optavim", "k8s"],
      "timezone": "browser",
      "refresh": "30s",
      "time": {"from": "now-3h", "to": "now"},
      "schemaVersion": 39,
      "version": 1,
      "editable": false,
      "templating": {"list": [
        {"name": "datasource", "type": "datasource", "query": "prometheus", "current": {"text": "Prometheus", "value": "Prometheus"}, "hide": 0},
        {"name": "namespace", "type": "query", "datasource": {"type": "prometheus", "uid": "$datasource"}, "query": "label_values(kube_pod_info, namespace)", "current": {"text": "All", "value": "$__all"}, "includeAll": true, "multi": true}
      ]},
      "links": [{"title": "Cluster", "url": "/d/opta-k8s-cluster", "type": "link", "icon": "external link"}],
      "panels": [
        {
          "id": 1, "type": "timeseries", "title": "CPU par application",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "targets": [{"expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\",container!=\"\",container!=\"POD\"}[5m]))", "refId": "A", "legendFormat": "{{pod}}"}],
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "unit": "short"}}
        },
        {
          "id": 2, "type": "timeseries", "title": "Mémoire par application",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "targets": [{"expr": "sum by (pod) (container_memory_working_set_bytes{namespace=~\"$namespace\",container!=\"\",container!=\"POD\"})", "refId": "A", "legendFormat": "{{pod}}"}],
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "unit": "bytes"}}
        },
        {
          "id": 3, "type": "timeseries", "title": "Trafic entrant",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "targets": [{"expr": "sum by (pod) (rate(container_network_receive_bytes_total{namespace=~\"$namespace\"}[5m]))", "refId": "A", "legendFormat": "{{pod}}"}],
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "unit": "Bps"}}
        },
        {
          "id": 4, "type": "timeseries", "title": "Trafic sortant",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "targets": [{"expr": "sum by (pod) (rate(container_network_transmit_bytes_total{namespace=~\"$namespace\"}[5m]))", "refId": "A", "legendFormat": "{{pod}}"}],
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "unit": "Bps"}}
        }
      ]
    }
  04-galera.json: |
    {
      "uid": "opta-db-galera",
      "title": "OPTAVIM — Base de données",
      "tags": ["optavim", "db"],
      "timezone": "browser",
      "refresh": "30s",
      "time": {"from": "now-3h", "to": "now"},
      "schemaVersion": 39,
      "version": 1,
      "editable": false,
      "templating": {"list": [
        {"name": "datasource", "type": "datasource", "query": "prometheus", "current": {"text": "Prometheus", "value": "Prometheus"}, "hide": 0}
      ]},
      "links": [{"title": "Executive", "url": "/d/opta-exec", "type": "link", "icon": "external link"}],
      "panels": [
        {
          "id": 1, "type": "stat", "title": "Serveurs base de données",
          "gridPos": {"h": 5, "w": 6, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "targets": [{"expr": "mysql_global_status_wsrep_cluster_size", "refId": "A", "instant": true}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "#EF4444", "value": null}, {"color": "#F59E0B", "value": 2}, {"color": "#22D3EE", "value": 3}]}, "unit": "short"}}
        },
        {
          "id": 2, "type": "stat", "title": "État du cluster",
          "gridPos": {"h": 5, "w": 6, "x": 6, "y": 0},
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "targets": [{"expr": "mysql_global_status_wsrep_cluster_status", "refId": "A", "instant": true}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"color": {"mode": "fixed", "fixedColor": "#22D3EE"}, "mappings": [{"options": {"4": {"text": "Primary", "color": "green"}}, "type": "value"}]}}
        },
        {
          "id": 3, "type": "stat", "title": "Connexions actives",
          "gridPos": {"h": 5, "w": 6, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "targets": [{"expr": "mysql_global_status_threads_connected", "refId": "A", "instant": true}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"color": {"mode": "fixed", "fixedColor": "#3B82F6"}, "unit": "short"}}
        },
        {
          "id": 4, "type": "stat", "title": "Requêtes lentes",
          "gridPos": {"h": 5, "w": 6, "x": 18, "y": 0},
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "targets": [{"expr": "rate(mysql_global_status_slow_queries[5m])", "refId": "A", "instant": true}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "#22D3EE", "value": null}, {"color": "#F59E0B", "value": 1}, {"color": "#EF4444", "value": 10}]}, "unit": "qps"}}
        },
        {
          "id": 10, "type": "timeseries", "title": "Requêtes par seconde",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 5},
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "targets": [{"expr": "rate(mysql_global_status_questions[5m])", "refId": "A", "legendFormat": "qps"}],
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "unit": "qps"}}
        },
        {
          "id": 11, "type": "timeseries", "title": "Sessions actives",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 5},
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "targets": [
            {"expr": "mysql_global_status_threads_running", "refId": "A", "legendFormat": "running"},
            {"expr": "mysql_global_status_threads_connected", "refId": "B", "legendFormat": "connected"}
          ],
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "unit": "short"}}
        },
        {
          "id": 20, "type": "timeseries", "title": "File de réplication",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 13},
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "targets": [
            {"expr": "mysql_global_status_wsrep_local_recv_queue", "refId": "A", "legendFormat": "recv queue"},
            {"expr": "mysql_global_status_wsrep_local_send_queue", "refId": "B", "legendFormat": "send queue"}
          ],
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "unit": "short"}}
        },
        {
          "id": 21, "type": "timeseries", "title": "Efficacité du cache",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 13},
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "targets": [{"expr": "100 * (1 - rate(mysql_global_status_innodb_buffer_pool_reads[5m]) / rate(mysql_global_status_innodb_buffer_pool_read_requests[5m]))", "refId": "A", "legendFormat": "hit ratio"}],
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "unit": "percent", "min": 0, "max": 100}}
        }
      ]
    }
  05-redis.json: |
    {
      "uid": "opta-db-redis",
      "title": "OPTAVIM — Cache Redis",
      "tags": ["optavim", "db"],
      "timezone": "browser",
      "refresh": "30s",
      "time": {"from": "now-3h", "to": "now"},
      "schemaVersion": 39,
      "version": 1,
      "editable": false,
      "templating": {"list": [
        {"name": "datasource", "type": "datasource", "query": "prometheus", "current": {"text": "Prometheus", "value": "Prometheus"}, "hide": 0}
      ]},
      "links": [{"title": "Executive", "url": "/d/opta-exec", "type": "link", "icon": "external link"}],
      "panels": [
        {
          "id": 1, "type": "stat", "title": "Service Redis",
          "gridPos": {"h": 5, "w": 6, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "targets": [{"expr": "redis_up", "refId": "A", "instant": true}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "#EF4444", "value": null}, {"color": "#22D3EE", "value": 1}]}, "mappings": [{"options": {"0": {"text": "DOWN"}, "1": {"text": "UP"}}, "type": "value"}]}}
        },
        {
          "id": 2, "type": "stat", "title": "Clients connectés",
          "gridPos": {"h": 5, "w": 6, "x": 6, "y": 0},
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "targets": [{"expr": "redis_connected_clients", "refId": "A", "instant": true}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"color": {"mode": "fixed", "fixedColor": "#3B82F6"}, "unit": "short"}}
        },
        {
          "id": 3, "type": "stat", "title": "Mémoire utilisée",
          "gridPos": {"h": 5, "w": 6, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "targets": [{"expr": "redis_memory_used_bytes", "refId": "A", "instant": true}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"color": {"mode": "fixed", "fixedColor": "#22D3EE"}, "unit": "bytes"}}
        },
        {
          "id": 4, "type": "stat", "title": "Clés stockées",
          "gridPos": {"h": 5, "w": 6, "x": 18, "y": 0},
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "targets": [{"expr": "sum(redis_db_keys)", "refId": "A", "instant": true}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"color": {"mode": "fixed", "fixedColor": "#6366F1"}, "unit": "short"}}
        },
        {
          "id": 10, "type": "timeseries", "title": "Taux de succès du cache",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 5},
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "targets": [{"expr": "100 * rate(redis_keyspace_hits_total[5m]) / (rate(redis_keyspace_hits_total[5m]) + rate(redis_keyspace_misses_total[5m]))", "refId": "A", "legendFormat": "hit ratio %"}],
