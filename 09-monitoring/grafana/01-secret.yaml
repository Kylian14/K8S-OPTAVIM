apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: monitoring
  labels:
    app: grafana
    project: optavim
type: Opaque
stringData:
  GRAFANA_ADMIN_PASSWORD: "CHANGE_ME_password"
  # Generated by Keycloak when the `grafana` client is created
  # (replaced automatically by the configure-oidc-clients.sh script)
  OIDC_CLIENT_SECRET: "CHANGE_ME_after_keycloak_client_creation"
