apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app: prometheus
    project: optavim
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
      external_labels:
        cluster: optavim
        env: prod

    scrape_configs:
      # ── Prometheus self ─────────────────────────────────────────
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']

      # ── Node Exporter (DaemonSet host metrics) ──────────────────
      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name]
            action: keep
            regex: monitoring;node-exporter
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node

      # ── kube-state-metrics ──────────────────────────────────────
      - job_name: kube-state-metrics
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name]
            action: keep
            regex: monitoring;kube-state-metrics

      # ── kubelet /metrics ────────────────────────────────────────
      - job_name: kubelet
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics

      # ── kubelet cAdvisor (container metrics) ────────────────────
      - job_name: cadvisor
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

      # ── Annotated pods (scrape if annotation prometheus.io/scrape=true) ──
      # Covers: Keycloak, MinIO, Traefik, redis-exporter, haproxy-exporter
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: app

      # ── Annotated services (catch orphan Services without an annotated pod) ──
      # Covers: traefik-metrics, redis-exporter Service, haproxy-exporter Service
      - job_name: kubernetes-services
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            action: replace
            target_label: service

      # ── MariaDB Galera metrics (operator-managed Deployment) ────────
      # mariadb-galera-metrics:9104 -> mysqld_exporter v0.15.1
      - job_name: mariadb-galera
        static_configs:
          - targets: ['mariadb-galera-metrics.databases.svc.cluster.local:9104']
            labels:
              app: mariadb-galera
              component: db
              site: siege

      # ── Blackbox HTTP probes (OPTAVIM endpoints) ────────────────────
      # All public OPTAVIM apps scraped via blackbox-exporter.
      # 6 internal HTTPS endpoints (AD CS CA) probed every 30s.
      - job_name: blackbox-http
        metrics_path: /probe
        params:
          module: [http_2xx]
        scrape_interval: 60s
        scrape_timeout: 15s
        static_configs:
          - targets:
              - https://auth.optavim.corp
              - https://cloud.optavim.corp
              - https://erp.optavim.corp
              - https://rh.optavim.corp
              - https://mfa.optavim.corp
              - https://grafana.optavim.corp
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.monitoring.svc.cluster.local:9115

      # ── Blackbox TCP probes (Galera, Redis, NFS) ────────────────────
      - job_name: blackbox-tcp
        metrics_path: /probe
        params:
          module: [tcp_connect]
        scrape_interval: 60s
        static_configs:
          - targets:
              - mariadb-galera.databases.svc.cluster.local:3306
              - redis.databases.svc.cluster.local:6379
              - 10.1.30.100:2049   # NFS HA VIP
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.monitoring.svc.cluster.local:9115

      # ── SNMP pfSense (HQ + branch) ──────────────────────────────
      # Targets enabled once the SNMP service is configured on pfSense.
      # For now the targets stay "down" while SNMP is disabled.
      - job_name: snmp-pfsense
        metrics_path: /snmp
        params:
          module: [if_mib]
        scrape_interval: 60s
        static_configs:
          - targets:
              - 10.1.10.1   # pfSense HQ LAN VIP
              - 10.20.0.3   # Rennes branch NUC
            labels:
              site: multi
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: snmp-exporter.monitoring.svc.cluster.local:9116
