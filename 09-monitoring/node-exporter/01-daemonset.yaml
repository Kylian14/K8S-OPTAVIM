---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: monitoring
  labels:
    app: node-exporter
    project: optavim
spec:
  clusterIP: None   # headless for Prometheus scrape via SD
  selector:
    app: node-exporter
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring
  labels:
    app: node-exporter
    project: optavim
    phase: "7"
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
        project: optavim
      annotations:
        # node-exporter MUST read host kernel/process/filesystem metrics.
        ignore-check.kube-linter.io/host-network: "node-exporter scrapes host network stats; hostNetwork is required by design"
        ignore-check.kube-linter.io/host-pid: "node-exporter reads per-process metrics from the host PID namespace"
        ignore-check.kube-linter.io/sensitive-host-mounts: "host /proc,/sys,/ mounted read-only to expose node metrics; required by node-exporter"
    spec:
      # trivy:ignore:KSV-0009 hostNetwork required: node-exporter scrapes host network stats
      hostNetwork: true
      # trivy:ignore:KSV-0010 hostPID required: node-exporter reads host per-process metrics
      hostPID: true
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - operator: Exists    # schedule on masters too
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.8.2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --path.rootfs=/host/root
            - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
            - --collector.netclass.ignored-devices=^(veth|cali|vxlan|lo)
          ports:
            - name: metrics
              containerPort: 9100
              # trivy:ignore:KSV-0024 hostPort required: Prometheus scrapes node-exporter on the host IP:9100
              hostPort: 9100
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: root
              mountPath: /host/root
              readOnly: true
              mountPropagation: HostToContainer
      volumes:
        # trivy:ignore:KSV-0121 host /proc,/sys,/ mounted read-only to expose node metrics; required by node-exporter
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: root
          hostPath:
            path: /
